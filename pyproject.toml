[project]
name = "wp2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adam-fahim", email = "adam.fahim@t-nex.de" }
]
requires-python = ">=3.11"
dependencies = [
    "fastparquet>=2026.9.0",
    "numpy>=2.4.6",
